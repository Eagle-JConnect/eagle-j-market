<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAGLE-J MARKET — Admin Dashboard</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <div id="nav"></div>

  <main class="container">

    <div class="admin-header">
      <h1>Admin Dashboard</h1>
      <p>Manage EAGLE-J MARKET</p>

      <button id="logout" class="btn danger">
        Logout
      </button>
    </div>

    <!-- STATS -->
    <section class="stats">

      <div class="card">
        <h3>Users</h3>
        <strong id="users">0</strong>
      </div>

      <div class="card">
        <h3>Pending Businesses</h3>
        <strong id="pending">0</strong>
      </div>

      <div class="card">
        <h3>Total Businesses</h3>
        <strong id="businesses">0</strong>
      </div>

      <div class="card">
        <h3>Pending Payments</h3>
        <strong id="payments">0</strong>
      </div>

    </section>

    <!-- TABS -->
    <div class="admin-nav">

      <button class="btn" data-tab="businessTab">
        Businesses
      </button>

      <button class="btn" data-tab="usersTab">
        Users
      </button>

      <button class="btn" data-tab="paymentsTab">
        Payments
      </button>

    </div>

    <!-- BUSINESSES -->
    <section id="businessTab">

      <h2>Businesses</h2>

      <div id="businessTable">
        Loading...
      </div>

    </section>

    <!-- USERS -->
    <section id="usersTab" class="hidden">

      <h2>Users</h2>

      <div id="userTable">
        Loading...
      </div>

    </section>

    <!-- PAYMENTS -->
    <section id="paymentsTab" class="hidden">

      <h2>Payments</h2>

      <div id="paymentTable">
        Loading...
      </div>

    </section>

  </main>

  <script type="module">

    import { supabase } from './supabase.js';

    import {
      nav,
      requireAuth,
      profile,
      esc,
      toast
    } from './utils.js';


    /* =========================
       NAVIGATION
    ========================= */

    document.querySelector('#nav').innerHTML = nav();


    /* =========================
       CHECK AUTH
    ========================= */

    const u = await requireAuth();

    if (!u) {
      window.location.href = 'login.html';
    }


    /* =========================
       CHECK ADMIN
    ========================= */

    if (u) {

      const p = await profile();

      if (!p || p.account_type !== 'admin') {

        window.location.href = 'dashboard.html';

      } else {


        /* =========================
           ELEMENTS
        ========================= */

        const usersEl = document.querySelector('#users');
        const pendingEl = document.querySelector('#pending');
        const businessesEl = document.querySelector('#businesses');
        const paymentsEl = document.querySelector('#payments');

        const businessTable =
          document.querySelector('#businessTable');

        const userTable =
          document.querySelector('#userTable');

        const paymentTable =
          document.querySelector('#paymentTable');


        /* =========================
           LOAD DATA
        ========================= */

        async function load() {

          const [

            us,
            bs,
            ps

          ] = await Promise.all([

            supabase
              .from('profiles')
              .select('*')
              .order('created_at', {
                ascending: false
              }),

            supabase
              .from('businesses')
              .select('*,categories(name)')
              .order('created_at', {
                ascending: false
              }),

            supabase
              .from('payments')
              .select('*,businesses(business_name)')
              .order('created_at', {
                ascending: false
              })

          ]);


          const U = us.data || [];
          const B = bs.data || [];
          const P = ps.data || [];


          /* =========================
             STATS
          ========================= */

          usersEl.textContent = U.length;

          pendingEl.textContent =
            B.filter(x => x.status === 'pending').length;

          businessesEl.textContent =
            B.length;

          paymentsEl.textContent =
            P.filter(x => x.status === 'pending').length;


          /* =========================
             BUSINESS TABLE
          ========================= */

          businessTable.innerHTML = `

            <table class="table">

              <thead>

                <tr>
                  <th>Business</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Plan</th>
                  <th>Action</th>
                </tr>

              </thead>

              <tbody>

                ${B.map(x => `

                  <tr>

                    <td>
                      <b>${esc(x.business_name)}</b>
                      <br>
                      <small>${esc(x.area || '')}</small>
                    </td>

                    <td>
                      ${esc(x.categories?.name || '')}
                    </td>

                    <td>

                      <span class="badge ${
                        x.status === 'approved'
                          ? 'green'
                          : x.status === 'pending'
                          ? 'yellow'
                          : 'red'
                      }">

                        ${esc(x.status)}

                      </span>

                    </td>

                    <td>
                      ${esc(x.plan || '')}
                    </td>

                    <td>

                      ${
                        x.status === 'pending'

                        ? `

                          <button
                            class="btn small success"
                            data-approve="${x.id}">
                            Approve
                          </button>

                          <button
                            class="btn small danger"
                            data-reject="${x.id}">
                            Reject
                          </button>

                        `

                        : ''
                      }


                      ${
                        x.status === 'approved'

                        ? `

                          <button
                            class="btn small secondary"
                            data-feature="${x.id}">

                            ${
                              x.featured
                                ? 'Unfeature'
                                : 'Feature'
                            }

                          </button>

                        `

                        : ''
                      }

                    </td>

                  </tr>

                `).join('')}

              </tbody>

            </table>

          `;


          /* =========================
             USER TABLE
          ========================= */

          userTable.innerHTML = `

            <table class="table">

              <thead>

                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Type</th>
                  <th>Status</th>
                </tr>

              </thead>

              <tbody>

                ${U.map(x => `

                  <tr>

                    <td>
                      ${esc(x.first_name || '')}
                      ${esc(x.last_name || '')}
                    </td>

                    <td>
                      ${esc(x.phone || '')}
                    </td>

                    <td>
                      ${esc(x.account_type || '')}
                    </td>

                    <td>
                      ${esc(x.status || '')}
                    </td>

                  </tr>

                `).join('')}

              </tbody>

            </table>

          `;


          /* =========================
             PAYMENT TABLE
          ========================= */

          paymentTable.innerHTML = `

            <table class="table">

              <thead>

                <tr>
                  <th>Business</th>
                  <th>Amount</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>

              </thead>

              <tbody>

                ${P.map(x => `

                  <tr>

                    <td>
                      ${esc(
                        x.businesses?.business_name || ''
                      )}
                    </td>

                    <td>
                      $${Number(x.amount || 0).toFixed(2)}
                    </td>

                    <td>
                      ${esc(x.payment_type || '')}
                    </td>

                    <td>
                      ${esc(x.status || '')}
                    </td>

                    <td>

                      ${
                        x.status === 'pending'

                        ? `

                          <button
                            class="btn small success"
                            data-pay="${x.id}">

                            Mark Paid

                          </button>

                        `

                        : ''
                      }

                    </td>

                  </tr>

                `).join('')}

              </tbody>

            </table>

          `;


          /* =========================
             APPROVE BUSINESS
          ========================= */

          document
            .querySelectorAll('[data-approve]')
            .forEach(button => {

              button.onclick = async () => {

                const r = await supabase
                  .from('businesses')
                  .update({
                    status: 'approved',
                    verified: true
                  })
                  .eq('id', button.dataset.approve);


                toast(
                  r.error?.message ||
                  'Business approved',
                  !r.error
                );


                if (!r.error) {
                  load();
                }

              };

            });


          /* =========================
             REJECT BUSINESS
          ========================= */

          document
            .querySelectorAll('[data-reject]')
            .forEach(button => {

              button.onclick = async () => {

                const r = await supabase
                  .from('businesses')
                  .update({
                    status: 'rejected'
                  })
                  .eq('id', button.dataset.reject);


                toast(
                  r.error?.message ||
                  'Business rejected',
                  !r.error
                );


                if (!r.error) {
                  load();
                }

              };

            });


          /* =========================
             FEATURE BUSINESS
          ========================= */

          document
            .querySelectorAll('[data-feature]')
            .forEach(button => {

              button.onclick = async () => {

                const business =
                  B.find(
                    x =>
                      x.id === button.dataset.feature
                  );


                if (!business) return;


                const r = await supabase
                  .from('businesses')
                  .update({
                    featured: !business.featured
                  })
                  .eq('id', business.id);


                toast(
                  r.error?.message ||
                  (
                    business.featured
                      ? 'Business unfeatured'
                      : 'Business featured'
                  ),
                  !r.error
                );


                if (!r.error) {
                  load();
                }

              };

            });


          /* =========================
             MARK PAYMENT AS PAID
          ========================= */

          document
            .querySelectorAll('[data-pay]')
            .forEach(button => {

              button.onclick = async () => {

                const payment =
                  P.find(
                    x =>
                      x.id === button.dataset.pay
                  );


                if (!payment) return;


                const r = await supabase
                  .from('payments')
                  .update({
                    status: 'paid'
                  })
                  .eq('id', payment.id);


                toast(
                  r.error?.message ||
                  'Payment marked paid',
                  !r.error
                );


                if (!r.error) {
                  load();
                }

              };

            });

        }


        /* =========================
           TABS
        ========================= */

        document
          .querySelectorAll(
            '.admin-nav button[data-tab]'
          )
          .forEach(button => {

            button.onclick = () => {

              [
                'businessTab',
                'usersTab',
                'paymentsTab'
              ].forEach(id => {

                document
                  .querySelector('#' + id)
                  .classList.add('hidden');

              });


              document
                .querySelector(
                  '#' + button.dataset.tab
                )
                .classList.remove('hidden');

            };

          });


        /* =========================
           LOGOUT
        ========================= */

        document
          .querySelector('#logout')
          .addEventListener('click', async () => {

            const { error } =
              await supabase.auth.signOut();


            if (error) {

              toast(
                error.message,
                false
              );

              return;
            }


            window.location.href =
              'login.html';

          });


        /* =========================
           START DASHBOARD
        ========================= */

        load();

      }

    }

  </script>

</body>
</html>
