<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase Test | EAGLE-J MARKET</title><link rel="stylesheet" href="style.css?v=phase1-3"></head><body><main class="page"><div class="form-card"><h1>🦅 EAGLE-J MARKET</h1><h2>Supabase Connection Test</h2><div id="result">Testing...</div><p><a href="register.html">Back to Register</a></p></div></main><script type="module">import {supabase,supabaseConfigured} from './supabase.js';const r=document.querySelector('#result');if(!supabaseConfigured){r.innerHTML='<div class="message show">❌ Supabase configuration is missing or invalid.</div>'}else{try{const {error}=await supabase.from('categories').select('id').limit(1);if(error)throw error;r.innerHTML='<div class="message show ok">✅ Supabase is reachable.<br><br><b>HTTP 200 / database query successful.</b></div>'}catch(e){r.innerHTML='<div class="message show">❌ Supabase connection failed.<br><br>'+e.message+'</div>'}}</script></body></html>
