<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Dashboard | EAGLE-J MARKET</title><link rel="stylesheet" href="style.css?v=phase1-3"></head><body><div id="nav"></div><main class="page"><div class="page-head"><span class="eyebrow">BUSINESS CENTER</span><h1>Business Dashboard</h1><p class="muted">Create your listing, products and deals.</p></div><div id="notice"></div><div class="stats"><div class="stat"><b id="bizStatus">—</b><span>Business status</span></div><div class="stat"><b id="plan">Free</b><span>Plan</span></div><div class="stat"><b id="productsCount">0</b><span>Products</span></div><div class="stat"><b id="dealsCount">0</b><span>Deals</span></div></div><section class="form-card" style="max-width:none"><h2>My Business</h2><form id="bizForm"><div class="form-grid"><div class="field"><label>Business name</label><input id="bname" required></div><div class="field"><label>Category</label><select id="category" required></select></div><div class="field full"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Phone</label><input id="bphone"></div><div class="field"><label>WhatsApp</label><input id="wa"></div><div class="field"><label>Email</label><input id="bemail" type="email"></div><div class="field"><label>Website</label><input id="website" placeholder="https://..."></div><div class="field full"><label>Address</label><input id="address"></div><div class="field"><label>Area / Neighborhood</label><input id="area" placeholder="Neighborhood, district..."></div>
<div class="field"><label>City</label><input id="city" placeholder="City"></div>
<div class="field"><label>Region / State</label><input id="region" placeholder="Region or state"></div>
<div class="field"><label>Country</label><input id="country" placeholder="Country"></div>
<div class="field"><label>Postal code</label><input id="postal" placeholder="Postal code"></div>
<div class="field"><label>Remote / Online</label><select id="remote"><option value="false">No</option><option value="true">Yes</option></select></div><div class="field"><label>Cover image</label><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" class="upload-preview" hidden alt="Cover preview"><input id="cover" type="hidden"></div></div><br><button class="btn">Save Business</button></form></section><div class="two"><section class="form-card" style="max-width:none"><h2>Add Product</h2><form id="productForm"><div class="field"><label>Name</label><input id="pname" required></div><br><div class="field"><label>Description</label><textarea id="pdesc"></textarea></div><br><div class="form-grid"><div class="field"><label>Price</label><input id="price" type="number" step="0.01"></div><div class="field"><label>Product image</label><input id="pimageFile" type="file" accept="image/*"><img id="pimagePreview" class="upload-preview" hidden alt="Product preview"><input id="pimage" type="hidden"></div></div><br><button class="btn">Add Product</button></form></section><section class="form-card" style="max-width:none"><h2>Add Deal</h2><form id="dealForm"><div class="field"><label>Title</label><input id="dtitle" required></div><br><div class="field"><label>Description</label><textarea id="ddesc"></textarea></div><br><div class="form-grid"><div class="field"><label>Original price</label><input id="original" type="number" step="0.01"></div><div class="field"><label>Deal price</label><input id="dealprice" type="number" step="0.01"></div><div class="field"><label>Ends</label><input id="end" type="datetime-local"></div><div class="field"><label>Deal image</label><input id="dimageFile" type="file" accept="image/*"><img id="dimagePreview" class="upload-preview" hidden alt="Deal preview"><input id="dimage" type="hidden"></div></div><br><button class="btn">Create Deal</button></form></section></div><section class="section"><h2>My Products</h2><div id="products" class="grid"></div></section><section class="section"><h2>My Deals</h2><div id="deals" class="grid"></div></section><button class="btn danger" id="logout">Logout</button></main><script type="module" src="business-dashboard.js?v=phase1-3"></script></body></html>
