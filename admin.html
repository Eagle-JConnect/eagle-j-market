<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    EAGLE-J MARKET - Admin Dashboard
  </title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>


  <!-- NAV -->

  <div id="nav"></div>


  <main class="container">


    <!-- ADMIN HEADER -->

    <section class="admin-header">

      <div>

        <h1>
          Admin Dashboard
        </h1>

        <p>
          Manage EAGLE-J MARKET
        </p>

      </div>


      <button
        type="button"
        id="logout"
        class="btn danger"
      >
        Logout
      </button>

    </section>



    <!-- STATS -->

    <section class="stats">


      <div class="card">

        <h3>
          Users
        </h3>

        <strong id="users">
          0
        </strong>

      </div>


      <div class="card">

        <h3>
          Pending Businesses
        </h3>

        <strong id="pending">
          0
        </strong>

      </div>


      <div class="card">

        <h3>
          Total Businesses
        </h3>

        <strong id="businesses">
          0
        </strong>

      </div>


      <div class="card">

        <h3>
          Pending Payments
        </h3>

        <strong id="payments">
          0
        </strong>

      </div>


    </section>



    <!-- TABS -->

    <div class="admin-nav">


      <button
        type="button"
        class="btn"
        data-tab="businessTab"
      >
        Businesses
      </button>


      <button
        type="button"
        class="btn"
        data-tab="usersTab"
      >
        Users
      </button>


      <button
        type="button"
        class="btn"
        data-tab="paymentsTab"
      >
        Payments
      </button>


    </div>



    <!-- BUSINESSES -->

    <section id="businessTab">

      <h2>
        Businesses
      </h2>

      <div id="businessTable">
        Loading...
      </div>

    </section>



    <!-- USERS -->

    <section
      id="usersTab"
      class="hidden"
    >

      <h2>
        Users
      </h2>

      <div id="userTable">
        Loading...
      </div>

    </section>



    <!-- PAYMENTS -->

    <section
      id="paymentsTab"
      class="hidden"
    >

      <h2>
        Payments
      </h2>

      <div id="paymentTable">
        Loading...
      </div>

    </section>


  </main>



  <!-- JAVASCRIPT -->

  <script type="module">

    import {
      supabase
    } from "./supabase.js";


    import {
      nav,
      requireAuth,
      profile,
      logout,
      esc,
      toast
    } from "./utils.js";



    /* =========================
       NAVIGATION
    ========================= */

    document
      .querySelector("#nav")
      .innerHTML = nav();



    /* =========================
       AUTHENTICATION
    ========================= */

    const currentUser =
      await requireAuth();


    if (!currentUser) {

      throw new Error(
        "Authentication required."
      );

    }



    /* =========================
       ADMIN SECURITY
    ========================= */

    const currentProfile =
      await profile();


    if (
      !currentProfile ||
      currentProfile.account_type !== "admin"
    ) {

      window.location.replace(
        "dashboard.html"
      );

      throw new Error(
        "Admin access denied."
      );

    }



    /* =========================
       ELEMENTS
    ========================= */

    const usersElement =
      document.querySelector(
        "#users"
      );

    const pendingElement =
      document.querySelector(
        "#pending"
      );

    const businessesElement =
      document.querySelector(
        "#businesses"
      );

    const paymentsElement =
      document.querySelector(
        "#payments"
      );


    const businessTable =
      document.querySelector(
        "#businessTable"
      );

    const userTable =
      document.querySelector(
        "#userTable"
      );

    const paymentTable =
      document.querySelector(
        "#paymentTable"
      );



    /* =========================
       LOAD DATA
    ========================= */

    async function load() {

      try {


        const [
          usersResult,
          businessesResult,
          paymentsResult
        ] = await Promise.all([


          supabase
            .from("profiles")
            .select("*")
            .order(
              "created_at",
              {
                ascending: false
              }
            ),


          supabase
            .from("businesses")
            .select(
              "*,categories(name)"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            ),


          supabase
            .from("payments")
            .select(
              "*,businesses(business_name)"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )

        ]);


        const users =
          usersResult.data || [];

        const businesses =
          businessesResult.data || [];

        const payments =
          paymentsResult.data || [];



        /* =========================
           STATS
        ========================= */

        usersElement.textContent =
          users.length;


        pendingElement.textContent =
          businesses.filter(
            business =>
              business.status === "pending"
          ).length;


        businessesElement.textContent =
          businesses.length;


        paymentsElement.textContent =
          payments.filter(
            payment =>
              payment.status === "pending"
          ).length;



        /* =========================
           BUSINESS TABLE
        ========================= */

        businessTable.innerHTML = `

          <table class="table">

            <thead>

              <tr>

                <th>
                  Business
                </th>

                <th>
                  Category
                </th>

                <th>
                  Status
                </th>

                <th>
                  Plan
                </th>

                <th>
                  Action
                </th>

              </tr>

            </thead>


            <tbody>

              ${businesses.map(
                business => `

                <tr>

                  <td>

                    <b>
                      ${esc(
                        business.business_name
                      )}
                    </b>

                    <br>

                    <small>
                      ${esc(
                        business.area || ""
                      )}
                    </small>

                  </td>


                  <td>
                    ${esc(
                      business
                        .categories
                        ?.name || ""
                    )}
                  </td>


                  <td>

                    <span
                      class="badge ${
                        business.status ===
                        "approved"
                          ? "green"
                          : business.status ===
                            "pending"
                          ? "yellow"
                          : "red"
                      }"
                    >

                      ${esc(
                        business.status
                      )}

                    </span>

                  </td>


                  <td>
                    ${esc(
                      business.plan || ""
                    )}
                  </td>


                  <td>

                    ${
                      business.status ===
                      "pending"

                        ? `

                        <button
                          type="button"
                          class="btn small success"
                          data-approve="${business.id}"
                        >
                          Approve
                        </button>

                        <button
                          type="button"
                          class="btn small danger"
                          data-reject="${business.id}"
                        >
                          Reject
                        </button>

                      `

                        : ""
                    }


                    ${
                      business.status ===
                      "approved"

                        ? `

                        <button
                          type="button"
                          class="btn small secondary"
                          data-feature="${business.id}"
                        >

                          ${
                            business.featured
                              ? "Unfeature"
                              : "Feature"
                          }

                        </button>

                      `

                        : ""
                    }

                  </td>

                </tr>

              `
              ).join("")}

            </tbody>

          </table>

        `;



        /* =========================
           USERS TABLE
        ========================= */

        userTable.innerHTML = `

          <table class="table">

            <thead>

              <tr>

                <th>
                  Name
                </th>

                <th>
                  Phone
                </th>

                <th>
                  Type
                </th>

                <th>
                  Status
                </th>

              </tr>

            </thead>


            <tbody>

              ${users.map(
                user => `

                <tr>

                  <td>

                    ${esc(
                      user.first_name || ""
                    )}

                    ${esc(
                      user.last_name || ""
                    )}

                  </td>


                  <td>

                    ${esc(
                      user.phone || ""
                    )}

                  </td>


                  <td>

                    ${esc(
                      user.account_type ||
                      ""
                    )}

                  </td>


                  <td>

                    ${esc(
                      user.status || ""
                    )}

                  </td>

                </tr>

              `
              ).join("")}

            </tbody>

          </table>

        `;



        /* =========================
           PAYMENTS TABLE
        ========================= */

        paymentTable.innerHTML = `

          <table class="table">

            <thead>

              <tr>

                <th>
                  Business
                </th>

                <th>
                  Amount
                </th>

                <th>
                  Type
                </th>

                <th>
                  Status
                </th>

                <th>
                  Action
                </th>

              </tr>

            </thead>


            <tbody>

              ${payments.map(
                payment => `

                <tr>

                  <td>

                    ${esc(
                      payment
                        .businesses
                        ?.business_name ||
                      ""
                    )}

                  </td>


                  <td>

                    $${Number(
                      payment.amount || 0
                    ).toFixed(2)}

                  </td>


                  <td>

                    ${esc(
                      payment.payment_type ||
                      ""
                    )}

                  </td>


                  <td>

                    ${esc(
                      payment.status ||
                      ""
                    )}

                  </td>


                  <td>

                    ${
                      payment.status ===
                      "pending"

                        ? `

                        <button
                          type="button"
                          class="btn small success"
                          data-pay="${payment.id}"
                        >
                          Mark Paid
                        </button>

                      `

                        : ""
                    }

                  </td>

                </tr>

              `
              ).join("")}

            </tbody>

          </table>

        `;



        /* =========================
           APPROVE
        ========================= */

        document
          .querySelectorAll(
            "[data-approve]"
          )
          .forEach(button => {

            button.onclick =
              async () => {

                const result =
                  await supabase
                    .from(
                      "businesses"
                    )
                    .update({
                      status:
                        "approved",
                      verified:
                        true
                    })
                    .eq(
                      "id",
                      button.dataset
                        .approve
                    );


                toast(
                  result.error
                    ?.message ||
                    "Business approved",
                  !result.error
                );


                if (!result.error) {

                  await load();

                }

              };

          });



        /* =========================
           REJECT
        ========================= */

        document
          .querySelectorAll(
            "[data-reject]"
          )
          .forEach(button => {

            button.onclick =
              async () => {

                const result =
                  await supabase
                    .from(
                      "businesses"
                    )
                    .update({
                      status:
                        "rejected"
                    })
                    .eq(
                      "id",
                      button.dataset
                        .reject
                    );


                toast(
                  result.error
                    ?.message ||
                    "Business rejected",
                  !result.error
                );


                if (!result.error) {

                  await load();

                }

              };

          });



        /* =========================
           FEATURE
        ========================= */

        document
          .querySelectorAll(
            "[data-feature]"
          )
          .forEach(button => {

            button.onclick =
              async () => {

                const business =
                  businesses.find(
                    item =>
                      item.id ===
                      button.dataset
                        .feature
                  );


                if (!business) {
                  return;
                }


                const result =
                  await supabase
                    .from(
                      "businesses"
                    )
                    .update({
                      featured:
                        !business.featured
                    })
                    .eq(
                      "id",
                      business.id
                    );


                toast(
                  result.error
                    ?.message ||
                    (
                      business.featured
                        ? "Business unfeatured"
                        : "Business featured"
                    ),
                  !result.error
                );


                if (!result.error) {

                  await load();

                }

              };

          });



        /* =========================
           MARK PAYMENT PAID
        ========================= */

        document
          .querySelectorAll(
            "[data-pay]"
          )
          .forEach(button => {

            button.onclick =
              async () => {

                const payment =
                  payments.find(
                    item =>
                      item.id ===
                      button.dataset
                        .pay
                  );


                if (!payment) {
                  return;
                }


                const result =
                  await supabase
                    .from(
                      "payments"
                    )
                    .update({
                      status:
                        "paid"
                    })
                    .eq(
                      "id",
                      payment.id
                    );


                toast(
                  result.error
                    ?.message ||
                    "Payment marked paid",
                  !result.error
                );


                if (!result.error) {

                  await load();

                }

              };

          });


      } catch (error) {

        console.error(
          "Dashboard loading error:",
          error
        );

      }

    }



    /* =========================
       TABS
    ========================= */

    document
      .querySelectorAll(
        ".admin-nav button[data-tab]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {


            [
              "businessTab",
              "usersTab",
              "paymentsTab"
            ].forEach(id => {

              document
                .getElementById(id)
                .classList
                .add("hidden");

            });


            document
              .getElementById(
                button.dataset.tab
              )
              .classList
              .remove("hidden");

          }
        );

      });



    /* =========================
       LOGOUT
    ========================= */

    const logoutButton =
      document.getElementById(
        "logout"
      );


    logoutButton.addEventListener(
      "click",
      async () => {

        console.log(
          "LOGOUT BUTTON CLICKED"
        );


        logoutButton.disabled =
          true;

        logoutButton.textContent =
          "Logging out...";


        const result =
          await logout();


        if (!result.success) {

          console.error(
            "Logout failed:",
            result.error
          );


          alert(
            "Logout failed: " +
            (
              result.error
                ?.message ||
              "Unknown error"
            )
          );


          logoutButton.disabled =
            false;

          logoutButton.textContent =
            "Logout";

          return;

        }


        console.log(
          "LOGOUT COMPLETE"
        );


        /*
          Force browser to leave
          the Admin page.
        */

        window.location.replace(
          "./login.html"
        );

      }
    );



    /* =========================
       START
    ========================= */

    await load();


  </script>


</body>

</html>
